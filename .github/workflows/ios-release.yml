name: iOS static libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New immutable release tag (for example clawsy-ios-7.1.2-31-r1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ViSH-App/ImageMagick' && github.ref == 'refs/heads/ios-support'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read pinned source revision
        id: source
        run: python3 -c 'import json, os; open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + json.load(open("ios/source.json"))["revision"] + "\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ImageMagick/ImageMagick
          ref: ${{ steps.source.outputs.revision }}
          path: build/source
      - name: Install build tools
        run: |
          brew install cmake ninja pkgconf
          xcodebuild -version
      - name: Build static dependencies and ImageMagick
        run: python3 ios/build.py --sdk '${{ matrix.sdk }}' --source build/source --output 'build/imagemagick/${{ matrix.sdk }}'
      - name: Package libraries, headers and licenses
        run: python3 ios/package.py --sdk '${{ matrix.sdk }}' --source build/source --output dist
      - name: Verify relocated package
        run: python3 ios/verify.py --sdk '${{ matrix.sdk }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: ${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 1
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.sdk }}
          path: build/imagemagick/${{ matrix.sdk }}/logs/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*phone*'
          merge-multiple: true
          path: dist
      - name: Publish a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^clawsy-ios-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-r[0-9]+$ ]] || { echo 'Invalid iOS release tag'; exit 1; }
          cd dist
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
          cat > release-notes.md <<'EOF'
          Static ImageMagick Q16 HDRI with JPEG, PNG, WebP, TIFF, AVIF (AOM), LCMS and FreeType dependencies.

          Separate arm64 packages for iOS devices and iOS Simulator, minimum iOS 18.2. Each archive includes headers, static libraries, source/dependency/toolchain metadata, checksums and license notices. No external ImageMagick configuration or delegate executables are required. Both packages are linked from a relocated directory; the simulator package also passes eight image-format round trips.

          Verify SHA256SUMS before extracting. Releases are versioned; existing assets are never overwritten.
          EOF
          gh release create "$RELEASE_TAG" *.tar.gz SHA256SUMS --target "$RECIPE_COMMIT" --title "$RELEASE_TAG" --notes-file release-notes.md --latest=false
